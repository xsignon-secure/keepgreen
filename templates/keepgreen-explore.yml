# KeepGreen explore: `npx keepgreen init` writes this file to
# .github/workflows/keepgreen-explore.yml. Or copy it by hand.
#
# It looks at your app, picks important user flows that have no test yet,
# writes a test for each and opens ONE pull request with the tests that
# passed every run. It runs on your own GitHub runner with your own AI key.
# No XSignOn server is involved.
#
# Two jobs:
#   explore  runs the AI-written tests with a READ-ONLY token and uploads
#            them as a patch.
#   publish  never runs your project's code: it accepts the patch only if it
#            just ADDS test files, then opens the PR.
#
# Before you start:
#   1. Set url: (or start-command + start-url) in .keepgreen.yml.
#   2. Make the explore job match your test job below: Node or Python
#      version, install steps, browsers, env vars and services, so the app and
#      the tests run here the same way they do in your CI.
#   3. Add your AI key as a repository secret named ANTHROPIC_API_KEY
#      (or OPENAI_API_KEY plus a repository variable AUTOHEAL_MODEL; or
#      OpenRouter: see base-url / api-key below).
#   If playwright.config has a webServer, let Playwright reuse the app
#   KeepGreen started: reuseExistingServer: !process.env.CI || !!process.env.KEEPGREEN
#   4. Settings > Actions > General > Workflow permissions: tick
#      "Allow GitHub Actions to create and approve pull requests".
#   5. Run it from Actions > KeepGreen explore > Run workflow, or turn on the
#      weekly schedule below.
#   Optional: GitHub does not start your CI on a PR opened with the built-in
#   token. To get checks on KeepGreen's PRs, add a fine-grained token (this
#   repo only; Contents + Pull requests: read and write) as the secret
#   KEEPGREEN_PR_TOKEN. Only the publish job sees it.
#
# Your AI key is in the explore job, where the new tests run. Use a key with
# a spend limit.

name: KeepGreen explore

on:
  workflow_dispatch:
    inputs:
      url:
        description: App URL to explore (blank = url in .keepgreen.yml)
        required: false
      max-flows:
        description: New tests to try (1-10; blank = .keepgreen.yml)
        required: false
      flows:
        description: Optional. Flows to test, separated by ";" (blank = the AI picks)
        required: false
  # schedule:
  #   - cron: "0 6 * * 1" # every Monday 06:00 UTC

permissions:
  contents: read

concurrency:
  group: keepgreen-explore
  cancel-in-progress: false

jobs:
  explore:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
    outputs:
      written: ${{ steps.keepgreen.outputs.written }}
    steps:
      # A KeepGreen PR still waiting for review means the same flows would be
      # planned again, so a scheduled run stops here. A manual run goes ahead.
      - name: Skip if a KeepGreen PR is still open
        id: open
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          n="$(gh pr list --repo "$REPO" --state open --json headRefName --jq '[.[] | select(.headRefName | startswith("keepgreen/explore-"))] | length')"
          echo "count=$n" >> "$GITHUB_OUTPUT"
          [ "$n" = "0" ] || echo "::notice::A KeepGreen PR is still open; review or close it first. Skipping this run."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.open.outputs.count == '0' || steps.open.outputs.count == ''
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.open.outputs.count == '0' || steps.open.outputs.count == ''
        with:
          node-version: 22
      # Your install steps (same as your test workflow):
      - if: steps.open.outputs.count == '0' || steps.open.outputs.count == ''
        run: npm ci
      - if: steps.open.outputs.count == '0' || steps.open.outputs.count == ''
        run: npx playwright install --with-deps chromium
      - name: Flows you named
        id: flows
        if: inputs.flows != ''
        env:
          FLOWS: ${{ inputs.flows }}
        run: |
          {
            echo 'list<<KEEPGREEN_EOF'
            printf '%s\n' "$FLOWS" | tr ';' '\n'
            echo 'KEEPGREEN_EOF'
          } >> "$GITHUB_OUTPUT"
      - id: keepgreen
        if: steps.open.outputs.count == '0' || steps.open.outputs.count == ''
        uses: xsignon-secure/keepgreen@v{{VERSION}}
        with:
          url: ${{ inputs.url }}
          max-flows: ${{ inputs.max-flows }}
          flows: ${{ steps.flows.outputs.list }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          model: ${{ vars.AUTOHEAL_MODEL }}
          # OpenRouter or another OpenAI-compatible endpoint instead:
          # base-url: https://openrouter.ai/api/v1
          # api-key: ${{ secrets.OPENROUTER_API_KEY }}
          # price-in: "3"    # USD per 1M tokens of your model, so max-usd is enforced
          # price-out: "15"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.keepgreen.outputs.written != '0' && steps.keepgreen.outputs.written != ''
        with:
          name: keepgreen-out
          path: keepgreen-out/
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: explore
    if: needs.explore.outputs.written != '0' && needs.explore.outputs.written != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # With KEEPGREEN_PR_TOKEN the push and the PR start your CI; the
          # built-in token works too, but GitHub then runs no checks on the PR.
          token: ${{ secrets.KEEPGREEN_PR_TOKEN || github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: keepgreen-out
          path: ${{ runner.temp }}/keepgreen-out
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Check the patch only adds test files
        env:
          npm_config_ignore_scripts: "true"
          OUT: ${{ runner.temp }}/keepgreen-out
        run: npx -y keepgreen@{{VERSION}} check-patch "$OUT/new-tests.patch"
      - name: Open the pull request
        env:
          GH_TOKEN: ${{ secrets.KEEPGREEN_PR_TOKEN || github.token }}
          OUT: ${{ runner.temp }}/keepgreen-out
          BRANCH: keepgreen/explore-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          git -c core.hooksPath=/dev/null apply --check "$OUT/new-tests.patch"
          git -c core.hooksPath=/dev/null apply "$OUT/new-tests.patch"
          git switch -c "$BRANCH"
          git add -A
          git -c user.name="keepgreen[bot]" -c user.email="keepgreen@users.noreply.github.com" -c core.hooksPath=/dev/null commit -m "test: new end-to-end tests from KeepGreen explore"
          git push origin "$BRANCH"
          gh pr create --head "$BRANCH" --title "KeepGreen: new end-to-end tests" --body-file "$OUT/report.md"
