name: Release

# Pushing a tag vX.Y.Z publishes that version to npm with provenance and
# creates the GitHub release. No npm token: npm trusted publishing (OIDC).
# Setup once on npmjs.com > keepgreen > Settings > Trusted publishing:
#   GitHub Actions · owner xsignon-secure · repo keepgreen · workflow release.yml · environment release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Builds and tests the tagged commit and packs the tarball. Runs the
  # dependencies' code, so it gets no OIDC token and no write access.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: ''
      - name: The tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "v$version" != "$TAG" ]; then echo "::error::Tag $TAG does not match package.json version $version. Push the tag after the release PR is merged."; exit 1; fi
      - name: The tag is on main
        run: |
          git fetch --no-tags --depth=200 origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME is not on main."; exit 1; }
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Pack
        run: |
          mkdir pkg
          npm pack --pack-destination pkg --ignore-scripts
          ls -l pkg
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: pkg/*.tgz
          retention-days: 7
          if-no-files-found: error

  # Publishes the tarball from `verify`. Installs nothing and runs no project
  # code, so the OIDC token is only ever seen by npm itself.
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: pkg
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # No registry-url: it writes an .npmrc with a placeholder token, and
          # npm then sends that token instead of using trusted publishing (OIDC).
          cache: ''
      - name: Publish to npm with provenance
        run: |
          # "./" so npm reads a local file, not a GitHub shorthand (pkg/name).
          tgz="./$(ls pkg/*.tgz)"
          version="${GITHUB_REF_NAME#v}"
          # The very first version is published by hand (npm only allows trusted
          # publishing for a package that exists), so skip a version npm already has.
          if npx -y npm@12.2.1 view "keepgreen@$version" version --registry https://registry.npmjs.org/ 2>/dev/null | grep -qx "$version"; then
            echo "keepgreen@$version is already on npm; skipping publish."
            exit 0
          fi
          unset NODE_AUTH_TOKEN NPM_CONFIG_USERCONFIG
          npx -y npm@12.2.1 publish "$tgz" --provenance --access public --ignore-scripts --registry https://registry.npmjs.org/
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" pkg/*.tgz --repo "$REPO" --clobber
          else
            gh release create "$TAG" pkg/*.tgz --repo "$REPO" --verify-tag --latest --title "$TAG" --notes "See [CHANGELOG.md](https://github.com/$REPO/blob/$TAG/CHANGELOG.md). Published to npm with provenance: https://www.npmjs.com/package/keepgreen/v/${TAG#v}"
          fi
