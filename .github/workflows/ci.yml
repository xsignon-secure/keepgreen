name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm pack --dry-run

  # The whole explore chain against a real app and a real browser, with a
  # scripted AI (no key): start the app, inspect it, plan, write a test,
  # run it 3 times, keep it, hand it off as a patch that passes check-patch.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Install the fixture's Playwright and Chromium
        working-directory: e2e/fixture
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - run: node e2e/run.mjs

  # The self-host bundle builds from the tagged sources and both servers answer.
  selfhost:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and start
        working-directory: selfhost
        run: |
          cp .env.example .env
          docker compose up -d --build
      - name: Both servers answer
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8787/api/v1/health && curl -fsS http://127.0.0.1:8080/healthz && exit 0
            sleep 2
          done
          (cd selfhost && docker compose logs)
          exit 1
      - if: always()
        working-directory: selfhost
        run: docker compose down -v
