name: KeepGreen explore
description: Free, self-hosted AI test agent. Finds important user flows with no test and writes Playwright tests for them, with your own AI key.
author: xsignon-secure
branding:
  icon: check-circle
  color: green

# Runs `keepgreen explore` and leaves keepgreen-out/ (report.md, summary.json,
# new-tests.patch) for an upload step. It opens no PR itself: the template's
# publish job does that with a separate, write-only step. See
# templates/keepgreen-explore.yml.

inputs:
  url:
    description: App URL to explore (blank = url in .keepgreen.yml)
    required: false
    default: ""
  start-command:
    description: Command that starts your app (with start-url)
    required: false
    default: ""
  start-url:
    description: Address to wait for after start-command
    required: false
    default: ""
  max-flows:
    description: New tests to try (1-10; blank = .keepgreen.yml or 3)
    required: false
    default: ""
  max-usd:
    description: AI spend cap for the run in USD (blank = .keepgreen.yml or 3)
    required: false
    default: ""
  runs:
    description: Passing runs in a row a new test needs (blank = .keepgreen.yml or 5)
    required: false
    default: ""
  anthropic-api-key:
    description: Anthropic API key
    required: false
    default: ""
  openai-api-key:
    description: OpenAI API key (also set model)
    required: false
    default: ""
  model:
    description: Model id (optional for Anthropic)
    required: false
    default: ""
  working-directory:
    description: Project folder
    required: false
    default: "."
  version:
    description: keepgreen version from npm
    required: false
    default: "0.1.0"

outputs:
  written:
    description: Number of new tests kept
    value: ${{ steps.run.outputs.written }}

runs:
  using: composite
  steps:
    - id: run
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        OPENAI_API_KEY: ${{ inputs.openai-api-key }}
        AUTOHEAL_MODEL: ${{ inputs.model }}
        KG_VERSION: ${{ inputs.version }}
        KG_URL: ${{ inputs.url }}
        KG_START_COMMAND: ${{ inputs.start-command }}
        KG_START_URL: ${{ inputs.start-url }}
        KG_MAX_FLOWS: ${{ inputs.max-flows }}
        KG_MAX_USD: ${{ inputs.max-usd }}
        KG_RUNS: ${{ inputs.runs }}
        OUT: ${{ github.workspace }}/keepgreen-out
      run: |
        [ -n "$ANTHROPIC_API_KEY" ] || unset ANTHROPIC_API_KEY
        [ -n "$OPENAI_API_KEY" ] || unset OPENAI_API_KEY
        [ -n "$AUTOHEAL_MODEL" ] || unset AUTOHEAL_MODEL
        if ! [[ "$KG_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "::error::version must be like 1.2.3"; exit 2; fi
        args=(explore --out "$OUT")
        [ -n "$KG_URL" ] && args+=(--url "$KG_URL")
        [ -n "$KG_START_COMMAND" ] && args+=(--start-command "$KG_START_COMMAND")
        [ -n "$KG_START_URL" ] && args+=(--start-url "$KG_START_URL")
        [ -n "$KG_MAX_FLOWS" ] && args+=(--max-flows "$KG_MAX_FLOWS")
        [ -n "$KG_MAX_USD" ] && args+=(--max-usd "$KG_MAX_USD")
        [ -n "$KG_RUNS" ] && args+=(--runs "$KG_RUNS")
        set +e
        npx -y "keepgreen@$KG_VERSION" "${args[@]}"
        code=$?
        set -e
        written=0
        [ -f "$OUT/summary.json" ] && written="$(node -p 'require(process.env.OUT + "/summary.json").written.length')"
        echo "written=$written" >> "$GITHUB_OUTPUT"
        # 1 = ran fine but kept no test; that is not a failed job.
        if [ "$code" -gt 1 ] || { [ "$code" -eq 1 ] && [ ! -f "$OUT/summary.json" ]; }; then exit "$code"; fi
